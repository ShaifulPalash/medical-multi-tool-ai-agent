name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests
        # tests/ uses fake LLMs (RunnableLambda) and throwaway SQLite files —
        # no OPENAI_API_KEY or Kaggle credentials needed, so this runs the
        # same way on every push, including from forks.
        run: pytest tests/ -v
